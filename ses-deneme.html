<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ses denemesi</title>
<style>body{font:16px system-ui;margin:0;padding:16px;background:#111;color:#eee;max-width:640px;margin:auto}h1{font-size:20px}textarea{width:100%;box-sizing:border-box;min-height:120px;font:16px system-ui;border-radius:12px;padding:10px;background:#1c1c1c;color:#eee;border:1px solid #444}button,select{width:100%;min-height:48px;margin:6px 0;border-radius:12px;border:1px solid #555;background:#2a2a2a;color:#eee;font:600 15px system-ui}button.p{background:#c8742a;border-color:#c8742a;color:#fff}p{color:#aaa;font-size:13px}</style></head><body>
<h1>Ses denemesi</h1>
<textarea id="m">Ferrero fındık alımına başlıyor. Alımların yılbaşına kadar kırk beş bin ton kabuklu fındığı kapsaması bekleniyor. Kilogram başına iki yüz elli lira fiyat belirlendi.</textarea>
<button class="p" id="g">▶ 1 · Google sesi (YouTube'daki)</button>
<p id="gn">İnternet gerekir. Ses gelmezse Google bu adresi engelliyor demektir.</p>
<select id="v"></select><button id="c">▶ 3 · Cihazın kendi sesi</button>
<button id="d" onclick="location.href='https://cloud.google.com/text-to-speech'">2 · Google Cloud sesleri (resmî demo sayfası)</button>
<p>Cloud demo sayfasında Dil: Türkçe seç, metni yapıştırıp Dinle. Standard ve Wavenet seslerini karşılaştır.</p>
<script>
const $=s=>document.querySelector(s);let a;
function parcala(t){const out=[];t.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).forEach(c=>{while(c.length>180){let i=c.lastIndexOf(' ',180);out.push(c.slice(0,i));c=c.slice(i+1)}if(c)out.push(c)});return out}
$('#g').onclick=async()=>{const ps=parcala($('#m').value);$('#gn').textContent='Çalıyor…';try{for(const p of ps){await new Promise((ok,no)=>{a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=tr&q='+encodeURIComponent(p));a.onended=ok;a.onerror=()=>no(new Error('ses gelmedi'));a.play().catch(no)})}$('#gn').textContent='Bitti.'}catch(e){$('#gn').textContent='Olmadı: '+e.message+' (Google engelliyor ya da internet yok)'}};
function doldur(){const l=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang));$('#v').innerHTML=l.map(v=>`<option value="${v.name}">${v.name}</option>`).join('')||'<option>Türkçe cihaz sesi yok</option>'}
speechSynthesis.onvoiceschanged=doldur;doldur();
$('#c').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('#m').value);u.lang='tr-TR';const v=speechSynthesis.getVoices().find(x=>x.name===$('#v').value);if(v)u.voice=v;speechSynthesis.speak(u)};
</script></body></html>
